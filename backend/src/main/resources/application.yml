# Every value here can be overridden by an environment variable of the same name (Spring Boot's
# "relaxed binding": SPRING_DATASOURCE_URL overrides spring.datasource.url, etc.). That's what lets
# the exact same jar run locally (via docker-compose's defaults below) and on Railway/Render (via
# whatever env vars they inject) with zero code change - see ARCHITECTURE.md "Config, the 12-factor way".
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stockapp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockapp}
    username: ${SPRING_DATASOURCE_USERNAME:stockapp}
    password: ${SPRING_DATASOURCE_PASSWORD:stockapp}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (see db/migration). Hibernate only checks that entities match it -
      # if you change an entity without adding a migration, the app fails fast at startup instead
      # of silently drifting from the real table shape.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # 32+ chars (HS256 needs >= 256 bits). CHANGE THIS and pass a real one via env var in every
    # environment beyond your own laptop - never commit a real secret to git.
    secret: ${APP_JWT_SECRET:change-this-to-a-long-random-string-before-deploying}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}

logging:
  level:
    com.sie.core: ${APP_LOG_LEVEL:INFO}
