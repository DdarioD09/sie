# Local dev / self-hosting entry point: `docker compose up --build` gets you Postgres + backend +
# frontend all wired together. This is also the closest thing to a spec for how the app is
# configured in any environment (Railway/Render read the same env vars, just injected by their own
# dashboard instead of this file) - see ARCHITECTURE.md "Config, the 12-factor way".

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockapp
      POSTGRES_USER: stockapp
      POSTGRES_PASSWORD: stockapp
    volumes:
      - stockapp-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # exposed so you can also connect a local SQL client (DBeaver, psql) while learning
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/stockapp
      SPRING_DATASOURCE_USERNAME: stockapp
      SPRING_DATASOURCE_PASSWORD: stockapp
      # CHANGE this before deploying anywhere real - see application.yml's comment on app.jwt.secret.
      APP_JWT_SECRET: local-dev-only-secret-change-me-32chars-min
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  stockapp-db-data:
