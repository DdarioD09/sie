server {
    listen 80;

    # Angular routing: any path that isn't a real file falls back to index.html so refreshing
    # /catalog (a client-side route, not a real file on disk) doesn't 404.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access in production, mirroring proxy.conf.json in local dev - the backend
    # container is reachable at this nginx container's own hostname "backend" on the Docker
    # Compose network (see docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
